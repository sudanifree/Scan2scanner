name: Build distributables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }} EXE
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: ${{ matrix.arch }}
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==5.13.2
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean packaging/scan2scanner.spec
      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/Scan2scanner.exe "release/Scan2scanner-Windows-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Scan2scanner-Windows-${{ matrix.arch }}
          path: release/*.exe

  linux:
    name: Linux executable, DEB and RPM
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3
          sudo apt-get update
          sudo apt-get install -y rpm
          sudo gem install --no-document fpm
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean packaging/scan2scanner.spec
      - name: Build DEB and RPM packages
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" || -z "$VERSION" ]]; then VERSION="1.0.0"; fi
          mkdir -p package-root/opt/scan2scanner package-root/usr/bin package-root/usr/share/applications release
          install -m 0755 dist/Scan2scanner package-root/opt/scan2scanner/Scan2scanner
          install -m 0755 packaging/linux/scan2scanner package-root/usr/bin/scan2scanner
          install -m 0644 packaging/linux/scan2scanner.desktop package-root/usr/share/applications/scan2scanner.desktop
          find package-root -type d -exec chmod 0755 {} +
          cp dist/Scan2scanner release/Scan2scanner-Linux-x86_64
          fpm -s dir -t deb -C package-root -n scan2scanner -v "$VERSION" --architecture native --description "Local document scanning with USB scanner support" --depends sane-utils --depends cups-client -p "$GITHUB_WORKSPACE/release/scan2scanner_${VERSION}_amd64.deb" .
          fpm -s dir -t rpm -C package-root -n scan2scanner -v "$VERSION" --architecture native --description "Local document scanning with USB scanner support" --depends sane-backends --depends cups-client -p "$GITHUB_WORKSPACE/release/scan2scanner-${VERSION}.x86_64.rpm" .
          chmod 0644 "$GITHUB_WORKSPACE"/release/*.deb "$GITHUB_WORKSPACE"/release/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: Scan2scanner-Linux-x86_64
          path: release/*